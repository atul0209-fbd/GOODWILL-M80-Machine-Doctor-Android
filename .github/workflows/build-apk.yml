name: Build GOODWILL M80 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct Java sources
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/goodwill/m80doctor
          cat source-parts/MainActivity.java.part* > app/src/main/java/com/goodwill/m80doctor/MainActivity.java
          cat source-parts/SlmpClient.java.part* > app/src/main/java/com/goodwill/m80doctor/SlmpClient.java
          echo "MainActivity bytes: $(wc -c < app/src/main/java/com/goodwill/m80doctor/MainActivity.java)"
          echo "SlmpClient bytes: $(wc -c < app/src/main/java/com/goodwill/m80doctor/SlmpClient.java)"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GOODWILL-M80-Machine-Doctor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
