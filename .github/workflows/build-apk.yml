name: Build GOODWILL Machine Doctor v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct approved professional UI and logo
        shell: bash
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable
          cat packed/ui.part* > /tmp/ui.b64
          base64 -d /tmp/ui.b64 | gunzip > app/src/main/assets/index.html
          cat packed/icon.part* > /tmp/icon.b64
          base64 -d /tmp/icon.b64 > app/src/main/res/drawable/machine_doctor_icon.webp
          cp app/src/main/res/drawable/machine_doctor_icon.webp app/src/main/assets/machine_doctor_icon.webp
          sed -i 's/machine_doctor_icon\.png/machine_doctor_icon.webp/g' app/src/main/assets/index.html

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GOODWILL-Machine-Doctor-v3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
